name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  goreleaser:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    steps:
      - name: Get fuse bindings
        run: "sudo apt update && \
          sudo apt install --yes libfuse-dev linux-libc-dev"

      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
        id: go

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_container_image:
    name: Build image and chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
      attestations: write
      id-token: write
      pages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Log in to the Github Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build container for image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: true
          tags: |
            ghcr.io/nbisweden/sdafs:${{ github.ref_name }}
          labels: "
            org.opencontainers.image.source=\
            ${{ github.event.repository.clone_url }}\n
            org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')\n
            org.opencontainers.image.revision=${{ github.sha }}\n
            "

      - name: Prepare and push chart, fetch old and build index
        env:
          TAG: "${{ github.ref_name }}"
          TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          GHCRUSER: ${{ github.actor }}
          product: sdafs
        run: |

          # Get image digest
          digest=$(docker inspect "ghcr.io/nbisweden/$product:$TAG" |
             jq -r '.[].RepoDigests[]')
          if [ -z "$digest" ] || [ "$(echo "$digest" | wc -l)" -ne 1 ]; then
            echo "Unexpected digest: $digest"
            exit 1
          fi

          yq eval ".image.digest=\"${digest#*@}\"" \
            -i charts/"$product"/values.yaml

          yq eval ".version=\"${TAG#v}\"" \
            -i charts/"$product"/Chart.yaml

          mkdir web
          cd web
          mv ../charts .

          helm package --app-version="${TAG}" \
            ./charts/"$product"

          helm registry login --username "$GHCRUSER" --password "$TOKEN" ghcr.io

          helm push --username "$GHCRUSER" --password "$TOKEN" \
            "$product"-"${TAG#v}".tgz \
            oci://ghcr.io/nbisweden/charts

          git fetch --tags origin

          git tag | grep '^v' | cut -c 2- | while read -r version; do
            # try to pull the chart for version "$version", but no worries
            # if we fail
            helm pull oci://ghcr.io/nbisweden/charts/"$product:$version" || true
          done

          helm repo index .

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          enablement: true

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
